<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 340px; margin: 12px; color: #222 }
  h1 { font-size: 15px; margin: 0 0 8px }
  .row { display: flex; gap: 6px; margin: 8px 0; align-items: center }
  button { flex: 1; padding: 7px; border: 0; border-radius: 6px; cursor: pointer; font-weight: 600 }
  #toggle.on { background: #c0392b; color: #fff } #toggle.off { background: #1f9d55; color: #fff }
  #status { background: #f6f6f6; border-radius: 6px; padding: 8px; min-height: 36px; white-space: pre-wrap }
  input { width: 48px } pre { font-size: 11px; background: #fafafa; padding: 6px; max-height: 160px; overflow: auto }
  .muted { color: #777; font-size: 11px }
</style>
</head>
<body>
  <h1>AutoVideo Flow Bridge</h1>
  <div class="row">Tên profile <input id="profileName" style="width:160px" placeholder="vd Quân, Trung…"></div>
  <div class="muted">Đang chạy song song: <b id="profiles">0</b> profile</div>
  <div id="status">…</div>
  <div class="row"><button id="toggle" class="off">▶ Bật tự động</button><button id="diag">Kiểm tra trang</button></div>
  <div class="row">Giãn cách <input id="minGap" type="number" min="3"> – <input id="maxGap" type="number" min="3"> giây · chờ ảnh <input id="timeoutSec" type="number" min="60"> s</div>
  <div class="row"><button id="resume">Tiếp tục profile này (sau captcha)</button></div>
  <div class="muted">Giữ một tab flow.google.com/project/… đã đăng nhập. Chọn model/tỉ lệ 16:9/x1 trên Flow trước. Đã gửi: <b id="done">0</b> ảnh</div>
  <pre id="out" hidden></pre>
  <script src="popup.js"></script>
</body>
</html>
