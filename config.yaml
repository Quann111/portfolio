language: "Vietnamese"          # ngôn ngữ lời đọc
target_minutes: 20               # độ dài mỗi video
scene_seconds: 15                # ~ thời lượng 1 cảnh (ngắn hơn = đổi hình nhiều hơn, giữ chân người xem)
mode: "auto"                     # auto = chạy thẳng | quality = dừng chờ duyệt kịch bản rồi mới làm tiếp
knowledge_dir: "knowledge"       # .txt/.md tài liệu của bạn; research ưu tiên dùng nguồn này
music_dir: "music"               # music/<mood>/*.mp3 (energetic, calm, tension, uplifting); trống -> không nhạc
music_volume: 0.18
burn_subtitles: false            # true = in phụ đề lên video (từ khoá nhấn mạnh tô màu)
words_per_minute: 230            # tốc độ đọc để ước lượng số chữ (tự hiệu chỉnh theo data/wpm.json)
auto_start: false                # tự bấm Bắt đầu khi mở app
auto_topics:                     # tự nghiên cứu chủ đề: còn ≤ min_queue chủ đề chờ → tìm thêm `batch` chủ đề
  focus: []                   # series (B3): từ khoá chủ đề được giữ, vd ["quân sự", "công nghệ"]; trống = không lọc
  enabled: true
  engine: notebooklm             # notebooklm | qwen – ai nghĩ ra chủ đề
  nb_wait_minutes: 15            # chờ NotebookLM trả lời tối đa
  batch: 10
  min_queue: 10
  last30days: true               # đo độ hot YouTube 30 ngày (skills/last30days, cần uv + yt-dlp)
  niches: ["chiến tranh – quân sự", "địa chính trị – thời sự", "lịch sử – bí ẩn", "giải trí – người nổi tiếng"]
  niche_weights: {"chiến tranh – quân sự": 4, "địa chính trị – thời sự": 3, "lịch sử – bí ẩn": 2, "giải trí – người nổi tiếng": 1}
  max_news: 4                    # 2 ngách đầu hay bám thời sự
  banned_keywords: [
    "việt nam", "viet nam", "vietnam", "vietnamese", "hà nội", "hanoi", "sài gòn", "saigon",
    "hồ chí minh", "ho chi minh", "điện biên", "dien bien", "mậu thân", "tet offensive",
    "biển đông", "hoàng sa", "trường sa", "paracel", "spratly", "đảng cộng sản việt",
    "quốc hội việt", "việt cộng", "viet cong", "vnch", "việt nam cộng hòa",
    "chiến tranh đông dương", "indochina war", "khe sanh", "1979 biên giới",
    "sino-vietnamese", "mỹ lai", "my lai", "võ nguyên giáp", "giap"
  ]
  reference_channels:            # các kênh hợp ngách (quân sự, địa chính trị, lịch sử, nhân vật thế giới)
    - {name: "CaspianReport", url: "https://www.youtube.com/@CaspianReport"}
    - {name: "Memorias de Tiburón", url: "https://www.youtube.com/c/MemoriasdeTibur%C3%B3n"}
    - {name: "KIẾN THỨC THÚ VỊ Official", url: "https://www.youtube.com/c/KI%E1%BA%BENTH%E1%BB%A8CTH%C3%9AV%E1%BB%8A"}
    - {name: "KIẾN THỨC QUANH TA Official", url: "https://www.youtube.com/@KIENTHUCQUANHTA247"}
    - {name: "Vui Vẻ", url: "https://www.youtube.com/@VuiVe"}
    - {name: "Explaining Things Like You're Five", url: "https://www.youtube.com/channel/UCHW8ZaRnb9RPF0mHC2oCdZg"}
    # TODO: bổ sung thêm kênh vẽ tay quốc tế chuyên quân sự / lịch sử thế giới nếu có URL thật

auto_topics_shorts:              # tự nghiên cứu chủ đề cho Shorts (30–60s dọc 9:16)
  enabled: true
  batch: 5
  min_queue: 3
  seconds: 45

lmstudio:
  base_url: "http://localhost:1234/v1"
  model: "qwen/qwen3-vl-4b"      # mặc định khi vai trò không có trong models
  models:                        # mỗi lúc chỉ 1 model trên GPU (tự unload/load khi đổi bước)
    text: "qwen/qwen3-vl-4b"            # 28/10: chỉ dùng 4B (bỏ 8B) cho mọi việc (30B cũ: qwen3-30b-a3b-instruct-2507)
    vision: "qwen/qwen3-vl-4b"          # QC ảnh, khớp hình–lời, grounding, soi khung, repair
    light: "qwen/qwen3-vl-4b"           # sửa chính tả, trích thực thể, lọc tin, fact sheet
  context_length: 16384          # 27/10: 12k làm câu trả lời bị cắt (~3400 token) khi prompt dài
  gpu: "max"
  parallel: 2                  # 2 luồng (chính + chuẩn bị) gọi cùng lúc
  vision_max_side: 768           # QC nhanh: thu nhỏ ảnh trước khi gửi Qwen (ít token hình)
  unload_for_images: false       # true nếu thiếu VRAM khi tạo ảnh

tts:
  engine: "zerotts"              # zerotts (CPU, giọng có sẵn) | vieneu (CPU, clone từ ref_audio / data/voice_ref.wav)
  fallback_engine: "vieneu"      # engine chính lỗi khi load → dùng engine này (bạn chấm: ZeroTTS 1, VieNeu 2)
  voice: "baotrang"              # zerotts: baotrang, giahuy, hamy, huuduc, kimoanh, maichi, quangminh, tiendat
  model: "zeroweight-ai/ZeroTTS"  # chỉ ghi vào versions của job (tts.py tự chọn model theo engine)
  ref_audio: ""                  # file giọng mẫu 3-10s (wav). Trống -> dùng voice_instruct tạo giọng 1 lần rồi giữ cố định
  ref_text: ""
  speed: 1.0

notebook_profile: "VR"          # chỉ profile có tên này được nhận task NotebookLM

browsers:
  keep_open: ["QUAN"]           # tên profile KHÔNG bị đóng bởi "Đóng tất cả"

browser:                         # bấm Bắt đầu: extension chưa kết nối → mở sẵn tab (Chrome đã đăng nhập)
  open_on_start: true
  notebook_url: "https://notebook.google.com/"
  flow_url: "https://flow.google.com/"   # mở một project trong tab này
  captcha_auto_resume_sec: 180     # profile dính captcha: tự gỡ tạm dừng sau 180 s (0 = gỡ ngay, -1 = chỉ bấm tay)

script:                          # ai viết lời đọc
  engine: "notebooklm"           # notebooklm (extension chrome_ext_notebook) | qwen (LM Studio)
  wait_minutes: 25               # quá thời gian / extension tắt → job thử lại sau (xem fallback_qwen)
  new_notebook: false            # 27/10: tạo sổ mới xong thì không gửi được câu hỏi (3 lần) → dùng sổ đang mở
  fallback_qwen: false           # NotebookLM lỗi → chờ & thử lại, KHÔNG quay về Qwen tự viết (luồng cũ)
  scene_split: "notebooklm"      # chia cảnh: notebooklm (cùng slot viết kịch bản, không Qwen) | gemini | qwen
  image_prompts: "notebooklm"    # ai viết prompt ảnh khi cảnh chưa có prompt: gemini | notebooklm | qwen
  min_scene_seconds: 8           # cảnh ngắn hơn → gộp với cảnh kế (trừ câu hook)
  max_scene_seconds: 7           # cảnh dài hơn → chia nhiều hình nối tiếp (không đổi chữ) – plan B4
  parallel_chapters: 4           # số slot NotebookLM phụ viết chương song song (0 = viết tuần tự như cũ)
  nb_slots: 5                    # số tab NotebookLM chạy song song trên profile VR
  nb_stagger_sec: 20             # các slot gửi câu hỏi cách nhau ít nhất N giây (tránh bị NotebookLM giới hạn)
  nb_notebooks:                  # mỗi slot một sổ riêng (URL sổ đã tạo sẵn, có nguồn chung của kênh)
    - "https://notebook.google.com/notebook/5c91bb8a-6344-4cbb-9b07-8ca3d6c0dbd4"
    - "https://notebooklm.google.com/notebook/TODO_SLOT_2"
    - "https://notebooklm.google.com/notebook/TODO_SLOT_3"
    - "https://notebooklm.google.com/notebook/TODO_SLOT_4"
    - "https://notebooklm.google.com/notebook/TODO_SLOT_5"

research:                      # tra cứu web thời gian thực trước khi viết kịch bản
  mode: "web"                    # web (bắt buộc nguồn web, model chỉ làm bối cảnh) | web_first | offline
  region: "vn-vi"
  news_timelimit: "d"            # d = 24 giờ qua (tự nới ra 7 ngày nếu ít tin)
  max_pages: 8                   # số trang đọc tối đa
  cache_hours: 6
  trusted_domains: ["vnexpress.net", "tuoitre.vn", "thanhnien.vn", "vietnamnet.vn", "dantri.com.vn", "zingnews.vn",
                    "baochinhphu.vn", "reuters.com", "apnews.com", "bbc.com", "wikipedia.org"]

autoflow:                        # tạo ảnh bằng extension Auto Flow (Google Flow) – app chỉ xuất prompt + nhận ảnh
  inbox_dir: "~/Downloads/AutoFlow/Image"   # Save folder trong Auto Flow
  extra_inbox_dirs:              # Chrome đang đặt thư mục tải mặc định là Downloads\1 -> quét cả đây
    - "~/Downloads/1/AutoFlow/Image"
  exchange_dir: "exchange"       # prompts.txt, ảnh nhận về, report theo từng dự án
  wait_minutes: 60               # chờ ảnh tối đa mỗi lượt
  poll_seconds: 10
  fallback_local: false          # đã xoá model FLUX local – hết giờ chờ thì chỉ cảnh báo, tiếp tục chờ ảnh Flow
  prompt_max_chars: 2400         # luật cứng ở đầu prompt, quá dài chỉ cắt đuôi mô tả cảnh

image:
  provider: "flowbridge"         # flowbridge (extension riêng chrome_ext) | autoflow (Auto Flow, Import TXT) | local (FLUX)
  sd_exe: "vendor/sdcpp/sd-cli.exe"
  diffusion_model: "vendor/models/flux1-schnell-Q4_0.gguf"
  t5xxl: "vendor/models/t5xxl-Q4_K.gguf"
  clip_l: "vendor/models/clip_l-Q8_0.gguf"
  vae: "vendor/models/ae.safetensors"
  width: 1344
  height: 768
  steps: 4
  extra_args: ["--clip-on-cpu", "--vae-tiling"]
  style: "minimalist hand-drawn sketch, notion-style doodle, dark grey pencil line art on warm beige paper background #F5EBD7, small accents of red orange and blue only, lots of empty space, simple clean composition, separated objects, no watermark, no gibberish or random text"
  qc: true
  qc_fast: true                  # QC 1 ảnh/lần (đồng nhất với cảnh trước đo bằng OpenCV) – nhanh gần gấp đôi
  max_retries: 2                 # (cũ – nay dùng retry.image trong channel.yaml)

canvas:
  enabled: false                 # thử nghiệm: cảnh draw_over vẽ tiếp lên hình cảnh trước (img2img + mask)
  strength: 0.95

whiteboard:
  repo: "../srt-whiteboard-animation"
  python: "../srt-whiteboard-animation/.venv/Scripts/python.exe"
  hand_png: ""                   # ảnh tay cầm bút (PNG nền trong suốt); trống = ảnh mặc định của repo
  ink_path: "grid"
  color_fill: "contour-wipe"
  parallel_renders: 3
  max_regions: 5

encode:
  enabled: true
  aspect: auto        # auto | 16:9 | 9:16

youtube:                         # bộ đăng YouTube mỗi job (projects/<id>/youtube/): title + mô tả VI/EN + thumbnail
  enabled: true
  channel_name: "Kiến Thức Bảng Trắng – Whiteboard Explained"
  handle: "@kienthucbangtrang"
  channel_tags: ["#KienThucBangTrang", "#WhiteboardExplained"]
  subscribe_vi: "🔔 Đăng ký Kiến Thức Bảng Trắng để hiểu kinh tế, đời sống, công nghệ qua những bức vẽ dễ hiểu – video mới mỗi tuần."
  subscribe_en: "🔔 Subscribe to Whiteboard Explained for simple drawings that explain money, life and technology – new videos every week."
  member_vi: "Tham gia hội viên để nhận đặc quyền: youtube.com/@kienthucbangtrang/join"
  member_en: "Join this channel as a member to get perks: youtube.com/@kienthucbangtrang/join"
  disclaimer_vi: "- Ảnh thumbnail mang tính minh hoạ, có thể không xuất hiện y hệt trong video."
  disclaimer_en: "- Thumbnails are illustrative and may not appear exactly in the video."
  thumb_variants: 2              # số ảnh nền Flow (mỗi nền × 3 phương án chữ)
  wait_minutes: 10               # bước đóng gói chờ tối đa để bộ YouTube xong

style:
  default: "classic"             # classic = mỗi cảnh một clip | nikola = bảng hai đảo (repo hi-nikola/hand-drawn-explainer-video-nikola)

nikola:                          # kiểu Nikola: engine nét bản trong repo Nikola (không đụng whiteboard.repo)
  repo: "../nikola"
  python: "../nikola/.venv/Scripts/python.exe"
  # hand_follow / hand_height: bỏ trống = đọc khoảng khởi đầu trong references/semantic-island-storytelling.md
  ink_path: "skeleton"
  color_fill: "contour-wipe"
  parallel_renders: 2

opuscar:                         # kiểu Opuscar: dựng phim bằng code (repo lemo-opuscar), Chrome headless + ffmpeg
  look: dark-keynote             # giao diện phim (xem app/opuscar/engine/looks/)
  fps: 24                        # khung mỗi giây render
  size_long: 1920x1080           # video dài 16:9
  size_short: 1080x1920          # YouTube Shorts 9:16
  workers: 3                     # số job opuscar render song song
  node: node                     # lệnh node (trường PATH)
  chrome: "C:/Program Files/Google/Chrome/Application/chrome.exe"  # Chrome headless chụp khung
  music: auto                    # auto = sampler nếu có sample, không thì synth
  grain: 0                       # nét grainoverlay (0 = tắt)
  short_seconds: [30, 45, 60]    # mốc giây Short được chọn nhanh
  short_max: 180                 # tối đa giây cho Short

resources:
  gpu_throttle_c: 90             # ≥ → render 1 luồng
  gpu_pause_c: 95                # ≥ → tạm dừng tới khi nguội 10°C
  disk_cleanup_gb: 20            # < → dọn file tạm
  disk_stop_new_gb: 10           # < → không nhận job mới
  disk_emergency_gb: 5           # < → dừng khẩn
  vram_image_gb: 9               # VRAM cần trống trước khi tạo ảnh
  vram_tts_gb: 4
maintenance_hour: 3              # giờ chạy bảo trì hằng ngày

worker:
  prefetch: 0                    # 0 = tuần tự làm xong từng job một mới làm job kế tiếp
  script_ahead: 0                # 0 = không viết trước kịch bản job sau
  focus_one_job: true            # dồn hết tài nguyên cho 1 job, xong mới sang job kế

output_dir: "output"
work_dir: "work"
keep_work: false
api_port: 8765
