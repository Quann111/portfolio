# TỪ ĐIỂN PHÁT ÂM – thay thế trước khi đưa vào TTS, khớp nguyên từ.
# Khoá có chữ HOA (AI, NATO, WiFi) khớp ĐÚNG kiểu chữ → chữ "ai" (đại từ) không bị đọc thành "ây ai".
# Khoá viết thường (blockchain, %) khớp mọi kiểu chữ. Từ viết tắt HOA chưa có ở đây được tự đánh vần kiểu Việt
# (UAV → "u a vê"); muốn đọc như một từ (NATO → "na tô") thì thêm vào đây.
# Từ mô hình đọc sai (vd "đĩa đệm" → "đĩa đêm") thì thêm cách viết lại, vd  đĩa đệm: "đĩa, đệm"
# Từ bị Audio QC nghi đọc sai được ghi vào data/pronunciation_log.txt
